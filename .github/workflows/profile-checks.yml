name: Organization profile checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Markdown parser
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: -r scripts/profile-requirements.txt
      - name: Validate public profile and adversarial cases
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_profile.py
